[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandas_ta"
version = "0.1.0"
description = "Technical Analysis Indicators for pandas"
authors = [
    { name = "Tentacle", email = "tentacle@example.com" }
]
license = "MIT"
dependencies = [
    "setuptools",
    "pandas>=2.3.0,<3.0",
    "numpy>=2.3.0,<3.0",
    "scipy==1.15.1",
    "tensorflow==2.20.0",
    "numba @ file:///Users/tentacle/Projects/personal/tentacle/numba",
]

[project.optional-dependencies]
full = [
    "matplotlib>=3.5,<4.0",
    "seaborn>=0.11,<1.0"
]
test = [
    "pytest>=7.0,<9",
    "pytest-cov>=3.0,<5",
    "pandas-datareader>=0.10",
    "TA-Lib>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["pandas_ta*"]
exclude = ["data*", "images*"]